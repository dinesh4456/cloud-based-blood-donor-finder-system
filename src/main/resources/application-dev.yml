spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:h2:mem:blood_donor_finder_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

app:
  seed-data: false

# AWS S3 Configuration
aws:
  access-key: ${AWS_ACCESS_KEY:dummy-access-key}
  secret-key: ${AWS_SECRET_KEY:dummy-secret-key}
  region: us-east-1
  s3:
    bucket-name: blood-donor-finder-images
