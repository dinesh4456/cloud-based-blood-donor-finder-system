# ==============================================================================
# AWS Production Profile Configuration (application-prod.yml)
# ==============================================================================

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    threads:
      max: 200
      min-spare: 20
    connection-timeout: 20000
    accept-count: 100

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: blood-donor-finder-system

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    # Amazon RDS MySQL JDBC URL
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${RDS_HOSTNAME:localhost}:${RDS_PORT:3306}/${RDS_DB_NAME:blood_donor_finder_db}?createDatabaseIfNotExist=true&useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${RDS_USERNAME:admin}}
    password: ${SPRING_DATASOURCE_PASSWORD:${RDS_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: BloodFinderProdHikariPool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
      validation-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

# Security & App Secrets
app:
  jwt:
    # Set JWT_SECRET via AWS Systems Manager Parameter Store, Secrets Manager, or Environment Variable
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    token-prefix: "Bearer "
    header-string: "Authorization"
  # In production, seed data defaults to false unless explicitly enabled
  seed-data: ${APP_SEED_DATA:false}

logging:
  level:
    root: WARN
    com.bloodfinder: INFO
    org.springframework.security: WARN
    org.hibernate: ERROR
    com.zaxxer.hikari: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
