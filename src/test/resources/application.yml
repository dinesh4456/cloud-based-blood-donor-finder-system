spring:
  application:
    name: blood-donor-finder-system-test
  datasource:
    url: jdbc:h2:mem:blood_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
    token-prefix: "Bearer "
    header-string: "Authorization"
  seed-data: true

logging:
  level:
    root: WARN
    com.bloodfinder: INFO
    org.springframework.security: WARN
